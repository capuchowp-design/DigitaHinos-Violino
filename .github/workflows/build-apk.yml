name: Gerar APK

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
    inputs:
      canal:
        description: 'play = .aab para a Google Play (Billing, sem Pix) | apkpure = .apk com Pix'
        type: choice
        options: [play, apkpure]
        default: play
      anuncios_teste:
        description: 'Marcado = anúncios de TESTE do Google (use nos testes). DESMARQUE só no build que vai para produção.'
        type: boolean
        default: true
  push:
    tags: ['v*']          # ou crie uma tag v1.0.1, v1.0.2...

env:
  CANAL: ${{ inputs.canal || 'apkpure' }}   # tag v* continua gerando o APK de sempre
  ADS_TESTE: ${{ inputs.anuncios_teste == false && 'false' || 'true' }}
  ADMOB_APP_ID: ca-app-pub-4518875317226768~8327927947

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Conferir chave de assinatura (canal play)
        if: env.CANAL == 'play'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Canal play exige os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD e KEY_ALIAS."
            exit 1
          fi

      - name: Montar pasta www
        run: npm run prepare:www

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: ID do app AdMob no AndroidManifest (todos os canais)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" $M
          grep -q "APPLICATION_ID" $M || { echo "::error::Não consegui inserir o ID do AdMob no AndroidManifest"; exit 1; }

      - name: Ícone do app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for pair in mdpi:96 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher.png
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher_round.png
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar APK (apkpure)
        if: env.CANAL == 'apkpure'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Compilar e assinar AAB (play)
        if: env.CANAL == 'play'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew && ./gradlew bundleRelease && cd ..
          echo "$KS_B64" | base64 -d > release.keystore
          jarsigner -keystore release.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -signedjar violin-bounce.aab android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          echo "AAB assinado com a SUA chave."

      - name: Assinar com a sua chave (se existir) ou usar chave de teste
        if: env.CANAL == 'apkpure'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            export KS_PASS KS_ALIAS
            $BT/apksigner sign --ks release.keystore --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --out violin-bounce.apk aligned.apk
            echo "APK assinado com a SUA chave."
          else
            keytool -genkeypair -keystore teste.keystore -alias teste -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=Teste"
            $BT/apksigner sign --ks teste.keystore --ks-key-alias teste \
              --ks-pass pass:android --key-pass pass:android \
              --out violin-bounce.apk aligned.apk
            echo "APK assinado com chave de TESTE (não use para publicar)."
          fi

      - uses: actions/upload-artifact@v4
        if: env.CANAL == 'apkpure'
        with:
          name: violin-bounce-apk
          path: violin-bounce.apk

      - uses: actions/upload-artifact@v4
        if: env.CANAL == 'play'
        with:
          name: violin-bounce-aab
          path: violin-bounce.aab
